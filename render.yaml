# 목업 시연용 무료 배포 (Render). 순서는 docs/DEPLOY.md 맨 위.
# 임시 메모리 DB로 돌아가서, 서버가 다시 켜지면 연습 계정과 예시 데이터로 처음부터 시작해요.
# 발표용 진짜 배포는 Cloud Run + Atlas예요.
services:
  - type: web
    name: sur-vibe-demo
    runtime: node
    plan: free
    region: singapore
    # 임시 DB 프로그램을 미리 내려받아 두면 서버가 켜지는 시간이 줄어요.
    buildCommand: npm ci --include=dev && node -e "require('mongodb-memory-server-core').MongoBinary.getPath().then((p) => console.log('MongoDB 준비', p))"
    startCommand: node src/server.js
    healthCheckPath: /api/health
    # 자동 검사(GitHub Actions)를 통과한 커밋만 배포해요. 검사가 실패하면 배포가 멈춰요. (12강 CI/CD)
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render는 기본으로 운영 모드(production)로 켜요. 데모는 임시 DB를 써야 해서 개발 모드로 켜요.
      - key: NODE_ENV
        value: development
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: MONGOMS_DOWNLOAD_DIR
        value: /opt/render/project/src/.mongodb-binaries

  # 실제로 쓰는 가계부 (Render 무료 + MongoDB Atlas 무료). 데이터가 영구히 남아요.
  # 데모 버튼은 없고 각자 가입해서 써요. 순서는 docs/DEPLOY.md "진짜 사이트".
  - type: web
    name: sur-vibe
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      # 아래 두 값은 비밀이라 여기 적지 않아요. Render가 처음 만들 때 물어보면 직접 붙여 넣어요.
      - key: MONGODB_URI
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
