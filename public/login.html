<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="결제내역 캡처만 올리면 자동으로 분류해 주는 대학생 가계부">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>로그인 · 자동 분류 가계부</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="login-wrap">
    <h1 class="h3 text-center mb-1 fw-bold brand-title">자동 분류 가계부</h1>
    <p class="text-center text-muted mb-4">캡처만 올리면 알아서 정리돼요</p>

    <div class="card receipt p-4">
      <ul class="nav nav-pills nav-fill mb-3">
        <li class="nav-item"><button class="nav-link active" id="tab-login" type="button">로그인</button></li>
        <li class="nav-item"><button class="nav-link" id="tab-signup" type="button">회원가입</button></li>
      </ul>

      <form id="auth-form" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">아이디</label>
          <input id="username" class="form-control" autocomplete="username" required>
          <div class="form-text">영어 소문자, 숫자, _ 로 4~20자</div>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">비밀번호</label>
          <input id="password" type="password" class="form-control" autocomplete="current-password" required>
          <div class="form-text">8자 이상</div>
        </div>
        <div id="auth-error" class="alert alert-danger py-2 d-none" role="alert"></div>
        <button id="auth-submit" class="btn btn-primary w-100" type="submit">로그인</button>
        <button id="demo-login" class="btn btn-outline-secondary w-100 mt-2 d-none" type="button">가입 없이 데모로 둘러보기</button>
      </form>
    </div>
  </main>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
