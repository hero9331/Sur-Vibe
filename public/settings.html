<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="결제내역 캡처만 올리면 자동으로 분류해 주는 대학생 가계부">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>설정 · 자동 분류 가계부</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <!-- 설정 화면 디자인 시안. 이 화면에서만 불러와요. -->
  <link rel="stylesheet" href="/css/settings.css">
</head>
<body data-page="settings" class="settings-page">
  <header id="app-nav"></header>
  <main class="page">
    <h1 class="s-page-title">설정</h1>

    <!-- 불러오는 동안 보이는 자리. settings.js가 진짜 내용으로 바꿔요. -->
    <section id="profile-section" class="s-profile placeholder-glow" aria-label="내 정보">
      <span class="s-avatar placeholder"></span>
      <span class="placeholder col-4"></span>
    </section>
    <section id="budget-section">
      <div class="s-card placeholder-glow" aria-hidden="true">
        <span class="placeholder col-3 mb-3"></span>
        <span class="placeholder placeholder-lg col-6 mb-3"></span>
        <span class="placeholder col-12"></span>
      </div>
    </section>
    <section id="fixed-section"></section>
    <section id="forecast-section"></section>
    <section id="alert-section"></section>
    <section id="accounts-section"></section>
    <section id="user-section"></section>
    <section id="theme-section"></section>
  </main>

  <!-- 추가·수정 시트. 폰에서는 아래에서 올라오고, 넓은 화면에서는 가운데 떠요. -->
  <div class="modal fade sheet" id="sheet" tabindex="-1" aria-labelledby="sheet-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="sheet-form" novalidate>
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="modal-header">
          <h2 class="modal-title" id="sheet-title"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
        </div>
        <div class="modal-body" id="sheet-body"></div>
        <div class="modal-footer" id="sheet-footer"></div>
      </form>
    </div>
  </div>
  <div class="set-toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/layout.js"></script>
  <script type="module" src="/js/settings.js"></script>
</body>
</html>
