# main에 합치기 전에 코드를 자동으로 검사해요. (2강 CI, 5강 품질 검사)
name: 검사

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 채점 시험지를 고치지 않았는지 확인
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          if ! git diff --quiet "origin/$GITHUB_BASE_REF" HEAD -- test/contract.test.js; then
            echo "::error::test/contract.test.js는 고치면 안 돼요. 시험지가 아니라 내 코드를 고쳐 주세요."
            exit 1
          fi
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
